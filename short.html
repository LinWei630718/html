<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短網址產生器</title>
<style>
  :root{
    --bg: #0d1613;
    --surface: #142420;
    --surface-2: #1b322c;
    --line: #24413a;
    --text: #e8f2ee;
    --text-dim: #8fada4;
    --accent: #c8ff4d;
    --accent-dim: #7a9a3a;
    --danger: #ff6b6b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, #1a3129 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{margin-bottom:36px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-size:32px;
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  header p{
    color:var(--text-dim);
    font-size:14px;
    line-height:1.7;
    margin:0;
    max-width:52ch;
  }

  /* 壓縮視覺條 */
  .compress-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin:28px 0 32px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
  }
  .compress-track{
    flex:1;
    height:2px;
    background:linear-gradient(90deg, var(--line) 0%, var(--accent) 100%);
    position:relative;
    overflow:hidden;
  }
  .compress-track::after{
    content:"";
    position:absolute;
    top:0; left:-30%;
    width:30%; height:100%;
    background:var(--accent);
    animation: slide 2.8s ease-in-out infinite;
    box-shadow:0 0 8px var(--accent);
  }
  @keyframes slide{
    0%{left:-30%;}
    50%{left:100%;}
    100%{left:100%;}
  }
  @media (prefers-reduced-motion: reduce){
    .compress-track::after{animation:none;display:none;}
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px;
    margin-bottom:24px;
  }

  label{
    display:block;
    font-size:12px;
    font-family:var(--mono);
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .field{margin-bottom:18px;}
  .field:last-of-type{margin-bottom:0;}
  .prefix-row{
    display:flex;
    align-items:stretch;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--surface-2);
  }
  .prefix-row .prefix{
    display:flex;align-items:center;
    padding:0 12px;
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
    background:rgba(255,255,255,0.02);
    border-right:1px solid var(--line);
    white-space:nowrap;
  }
  input[type=text], input[type=url]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    outline:none;
  }
  .prefix-row input{
    border:none;
    border-radius:0;
    background:transparent;
  }
  input:focus, .prefix-row:focus-within{
    border-color:var(--accent);
  }
  .hint{
    font-size:12px;
    color:var(--text-dim);
    margin-top:6px;
  }
  .error-msg{
    font-size:12px;
    color:var(--danger);
    margin-top:6px;
    display:none;
  }

  button.primary{
    width:100%;
    margin-top:20px;
    background:var(--accent);
    color:#0d1613;
    border:none;
    border-radius:8px;
    padding:14px;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.primary:hover{
    box-shadow:0 4px 18px rgba(200,255,77,0.25);
    transform:translateY(-1px);
  }
  button.primary:active{transform:translateY(0);}

  .section-title{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin:0 0 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .count-badge{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 10px;
    color:var(--accent);
    font-size:11px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--text-dim);
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .link-item{
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
    background:var(--surface);
  }
  .link-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
  }
  .short-url{
    font-family:var(--mono);
    font-size:14px;
    color:var(--accent);
    word-break:break-all;
  }
  .original-url{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    word-break:break-all;
    margin-top:4px;
  }
  .link-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text-dim);
    font-size:12px;
    padding:6px 10px;
    cursor:pointer;
    font-family:var(--sans);
    white-space:nowrap;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--accent-dim);}
  .icon-btn.copied{color:var(--accent); border-color:var(--accent);}
  .icon-btn.del:hover{color:var(--danger); border-color:var(--danger);}

  .meta-row{
    font-size:11px;
    color:var(--text-dim);
    font-family:var(--mono);
    margin-top:8px;
  }

  .redirect-screen{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:16px; z-index:999;
    text-align:center;
    padding:20px;
  }
  .redirect-screen .code{
    font-family:var(--mono);
    color:var(--accent);
    font-size:14px;
  }
  .spinner{
    width:28px;height:28px;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{
    margin-top:40px;
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    line-height:1.8;
  }
</style>
</head>
<body>

<div id="redirectScreen" class="redirect-screen" style="display:none;">
  <div class="spinner"></div>
  <div>正在導向目的地…</div>
  <div class="code" id="redirectCode"></div>
</div>

<div class="wrap" id="mainApp">
  <header>
    <div class="eyebrow">Link Compressor</div>
    <h1>自訂短網址產生器</h1>
    <p>貼上一個很長的網址，取一個好記的代稱，壓縮成隨手就能分享的短連結。所有紀錄都儲存在這個瀏覽器裡。</p>
  </header>

  <div class="compress-bar">
    <span>長網址</span>
    <div class="compress-track"></div>
    <span>短網址</span>
  </div>

  <div class="card">
    <div class="field">
      <label for="longUrl">原始網址</label>
      <input type="url" id="longUrl" placeholder="https://example.com/一個/非常/冗長的/路徑?query=123">
      <div class="error-msg" id="urlError">請輸入有效的網址（需包含 http:// 或 https://）</div>
    </div>

    <div class="field">
      <label for="customCode">自訂代稱（選填）</label>
      <div class="prefix-row">
        <span class="prefix" id="prefixLabel">#</span>
        <input type="text" id="customCode" placeholder="不填則自動產生亂碼，例如 a7k2z9">
      </div>
      <div class="hint">僅能使用英數字、連字號與底線，長度 1～24 個字元</div>
      <div class="error-msg" id="codeError"></div>
    </div>

    <button class="primary" id="generateBtn">產生短網址</button>
  </div>

  <div class="section-title">
    <span>已建立的短網址</span>
    <span class="count-badge" id="countBadge">0 筆</span>
  </div>

  <div id="listContainer"></div>
</div>

<footer>
  短網址採用「本檔案網址 + #代稱」的形式運作，開啟含代稱的連結會自動導向原始網址。<br>
  請將此 HTML 檔放在固定的網址（例如你的網站或雲端硬碟分享連結）上，短網址才會持續有效。
</footer>

<script>
(function(){
  const STORAGE_KEY = 'shortlinks_v1';

  function loadLinks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveLinks(links){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }

  function baseUrl(){
    return location.origin + location.pathname;
  }

  function randomCode(existing){
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let code;
    do{
      code = '';
      for(let i=0;i<6;i++){
        code += chars[Math.floor(Math.random()*chars.length)];
      }
    }while(existing[code]);
    return code;
  }

  function isValidUrl(str){
    try{
      const u = new URL(str);
      return u.protocol === 'http:' || u.protocol === 'https:';
    }catch(e){ return false; }
  }

  function isValidCode(str){
    return /^[A-Za-z0-9_-]{1,24}$/.test(str);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render(){
    const links = loadLinks();
    const entries = Object.entries(links).sort((a,b) => b[1].created - a[1].created);
    const listContainer = document.getElementById('listContainer');
    const countBadge = document.getElementById('countBadge');
    countBadge.textContent = entries.length + ' 筆';

    if(entries.length === 0){
      listContainer.innerHTML = '<div class="empty">還沒有建立任何短網址，開始建立第一個吧。</div>';
      return;
    }

    listContainer.innerHTML = entries.map(([code, data]) => {
      const shortUrl = baseUrl() + '#' + code;
      return `
        <div class="link-item" data-code="${escapeHtml(code)}">
          <div class="link-top">
            <div>
              <div class="short-url">${escapeHtml(shortUrl)}</div>
              <div class="original-url">→ ${escapeHtml(data.url)}</div>
            </div>
            <div class="link-actions">
              <button class="icon-btn copy-btn">複製</button>
              <button class="icon-btn del del-btn">刪除</button>
            </div>
          </div>
          <div class="meta-row">建立於 ${formatDate(data.created)}　·　造訪 ${data.visits || 0} 次</div>
        </div>
      `;
    }).join('');

    listContainer.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        const item = this.closest('.link-item');
        const code = item.dataset.code;
        const shortUrl = baseUrl() + '#' + code;
        navigator.clipboard.writeText(shortUrl).then(() => {
          this.textContent = '已複製';
          this.classList.add('copied');
          setTimeout(() => {
            this.textContent = '複製';
            this.classList.remove('copied');
          }, 1500);
        }).catch(() => {
          this.textContent = '複製失敗';
        });
      });
    });

    listContainer.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        const item = this.closest('.link-item');
        const code = item.dataset.code;
        if(confirm('確定要刪除這個短網址嗎？此動作無法復原。')){
          const links = loadLinks();
          delete links[code];
          saveLinks(links);
          render();
        }
      });
    });
  }

  function showFieldError(el, msg){
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  document.getElementById('generateBtn').addEventListener('click', function(){
    const urlInput = document.getElementById('longUrl');
    const codeInput = document.getElementById('customCode');
    const urlError = document.getElementById('urlError');
    const codeError = document.getElementById('codeError');

    showFieldError(urlError, '');
    showFieldError(codeError, '');

    const url = urlInput.value.trim();
    let code = codeInput.value.trim();

    if(!isValidUrl(url)){
      showFieldError(urlError, '請輸入有效的網址（需包含 http:// 或 https://）');
      urlInput.focus();
      return;
    }

    const links = loadLinks();

    if(code){
      if(!isValidCode(code)){
        showFieldError(codeError, '代稱格式不符，僅能使用英數字、連字號與底線');
        codeInput.focus();
        return;
      }
      if(links[code]){
        showFieldError(codeError, '這個代稱已經被使用，請換一個');
        codeInput.focus();
        return;
      }
    }else{
      code = randomCode(links);
    }

    links[code] = { url, created: Date.now(), visits: 0 };
    saveLinks(links);

    urlInput.value = '';
    codeInput.value = '';
    render();
  });

  document.getElementById('longUrl').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('generateBtn').click();
  });
  document.getElementById('customCode').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('generateBtn').click();
  });

  // 導向邏輯：若網址帶有 #代稱，自動導向原始網址
  function handleRedirect(){
    const hash = location.hash.replace(/^#/, '');
    if(!hash) return false;
    const links = loadLinks();
    const entry = links[hash];
    if(!entry) return false;

    document.getElementById('mainApp').style.display = 'none';
    const screen = document.getElementById('redirectScreen');
    screen.style.display = 'flex';
    document.getElementById('redirectCode').textContent = '#' + hash + ' → ' + entry.url;

    entry.visits = (entry.visits || 0) + 1;
    links[hash] = entry;
    saveLinks(links);

    setTimeout(() => {
      window.location.href = entry.url;
    }, 900);
    return true;
  }

  if(!handleRedirect()){
    render();
  }
})();
</script>

</body>
</html>
