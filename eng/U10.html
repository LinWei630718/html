<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>U10單字密室：破解逃脫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     1. 設計系統變數（魔法星星冒險密室 — 護眼明亮繪本風）
     ========================================================= */
  :root {
    --sky-top: #d4f0ff;
    --sky-mid: #eef9ff;
    --cream-bot: #fff6d9;

    --card-bg: #ffffff;
    --card-border: #cde4ff;
    --card-shadow: 0 14px 32px rgba(45, 92, 160, 0.14);

    --ink: #1e2a4a;
    --ink-soft: #526285;

    --gold: #ffb703;
    --gold-deep: #d98e00;
    --gold-soft: #fff4cc;

    --mint: #2ec4b6;
    --mint-deep: #1b9489;
    --mint-soft: #def9f6;

    --blue: #3a86ff;
    --blue-deep: #2260cc;
    --blue-soft: #e6f0ff;

    --coral: #ff6b6b;
    --coral-deep: #d94646;
    --coral-soft: #ffe8e8;

    --warn: #f59e0b;
    --warn-soft: #fef3c7;

    --radius-card: 28px;
    --radius-btn: 18px;
    --font-en: 'Fredoka', 'Baloo 2', sans-serif;
    --font-zh: 'Noto Sans TC', sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    margin: 0;
    padding: 0;
    background-color: var(--sky-top);
  }

  body {
    margin: 0;
    min-height: 100dvh;
    padding:
      calc(16px + env(safe-area-inset-top, 0px))
      calc(14px + env(safe-area-inset-right, 0px))
      calc(28px + env(safe-area-inset-bottom, 0px))
      calc(14px + env(safe-area-inset-left, 0px));
    background: linear-gradient(175deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--cream-bot) 100%);
    color: var(--ink);
    font-family: var(--font-zh);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* =========================================================
     2. 背景漂浮星星與雲朵裝飾
     ========================================================= */
  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .bg-star {
    position: absolute;
    opacity: 0.65;
    animation: floatStar 6s ease-in-out infinite;
  }

  .bg-star.s1 { top: 8%; left: 6%; width: 32px; animation-delay: 0s; }
  .bg-star.s2 { top: 18%; right: 7%; width: 26px; animation-delay: 1.4s; }
  .bg-star.s3 { top: 55%; left: 4%; width: 22px; animation-delay: 2.5s; }
  .bg-star.s4 { bottom: 16%; right: 6%; width: 36px; animation-delay: 0.8s; }
  .bg-star.s5 { bottom: 8%; left: 12%; width: 24px; animation-delay: 3.2s; }

  .bg-cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    filter: blur(1px);
  }
  .bg-cloud.c1 { width: 150px; height: 48px; top: 44px; left: -30px; }
  .bg-cloud.c2 { width: 180px; height: 54px; top: 110px; right: -40px; }

  @keyframes floatStar {
    0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
    50% { transform: translateY(-12px) rotate(12deg) scale(1.08); }
  }

  /* =========================================================
     3. 主舞台與常駐頂部工具列
     ========================================================= */
  .app-shell {
    width: 100%;
    max-width: 720px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.88);
    border: 2px solid #ffffff;
    box-shadow: 0 4px 12px rgba(58, 134, 255, 0.14);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 900;
    font-size: 14px;
    color: var(--blue-deep);
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    border: 2px solid #cbe0ff;
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font-zh);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 #c5dafa;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  .tool-btn:hover {
    background: var(--blue-soft);
  }

  .tool-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #c5dafa;
  }

  .tool-btn .case-badge {
    font-family: var(--font-en);
    font-weight: 700;
    font-size: 15px;
    color: var(--blue-deep);
  }

  .tool-btn.muted {
    background: #f1f5f9;
    color: #64748b;
    border-color: #cbd5e1;
    box-shadow: 0 3px 0 #cbd5e1;
  }

  /* =========================================================
     4. 通用標題與卡片樣式
     ========================================================= */
  .stage {
    width: 100%;
    flex: 1;
  }

  .hero-header {
    text-align: center;
    margin-bottom: 16px;
  }

  .hero-title {
    margin: 0 0 6px;
    font-family: var(--font-zh);
    font-weight: 900;
    font-size: clamp(26px, 5.5vw, 38px);
    color: var(--ink);
    letter-spacing: 0.5px;
    text-shadow: 0 3px 0 rgba(255, 255, 255, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hero-sub {
    margin: 0;
    font-size: clamp(14px, 3vw, 16px);
    color: var(--ink-soft);
    font-weight: 500;
    line-height: 1.6;
  }

  .main-card {
    background: var(--card-bg);
    border: 3px solid var(--card-border);
    border-radius: var(--radius-card);
    padding: 24px 20px 24px;
    box-shadow: var(--card-shadow);
    position: relative;
  }

  /* =========================================================
     5. 難度選擇畫面
     ========================================================= */
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin-top: 22px;
  }

  @media (max-width: 560px) {
    .mode-grid {
      grid-template-columns: 1fr;
    }
  }

  .mode-card {
    appearance: none;
    text-align: left;
    background: #ffffff;
    border: 3px solid #d5e6ff;
    border-radius: 26px;
    padding: 22px 20px;
    cursor: pointer;
    color: var(--ink);
    font-family: var(--font-zh);
    box-shadow: 0 8px 0 #c8defc, 0 14px 26px rgba(58, 134, 255, 0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mode-card.simple-card {
    border-color: #9be9e1;
    box-shadow: 0 8px 0 #7fd8cf, 0 14px 26px rgba(46, 196, 182, 0.15);
  }

  .mode-card.advanced-card {
    border-color: #ffd07a;
    box-shadow: 0 8px 0 #f2b749, 0 14px 26px rgba(255, 183, 3, 0.16);
  }

  .mode-card:hover {
    transform: translateY(-4px);
  }

  .mode-card:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #c8defc;
  }

  .mode-card.simple-card:active { box-shadow: 0 3px 0 #7fd8cf; }
  .mode-card.advanced-card:active { box-shadow: 0 3px 0 #f2b749; }

  .mode-icon-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .mode-emoji {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .simple-card .mode-emoji { background: var(--mint-soft); }
  .advanced-card .mode-emoji { background: var(--gold-soft); }

  .mode-pill {
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .simple-card .mode-pill { background: var(--mint-soft); color: var(--mint-deep); }
  .advanced-card .mode-pill { background: var(--coral-soft); color: var(--coral-deep); }

  .mode-title {
    font-size: 23px;
    font-weight: 900;
    margin: 2px 0 0;
  }

  .mode-desc {
    margin: 0;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.65;
  }

  .mode-go {
    margin-top: auto;
    padding-top: 8px;
    font-weight: 900;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .simple-card .mode-go { color: var(--mint-deep); }
  .advanced-card .mode-go { color: var(--gold-deep); }

  /* =========================================================
     6. 號碼選單畫面（01~16）
     ========================================================= */
  .stats-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat-pill {
    background: #ffffff;
    border: 2px solid #d5e6ff;
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    box-shadow: 0 4px 10px rgba(45, 92, 160, 0.07);
  }

  .stat-pill b {
    font-family: var(--font-en);
    font-size: 16px;
    color: var(--blue-deep);
  }

  .stat-pill.gold b { color: var(--gold-deep); }
  .stat-pill.mint b { color: var(--mint-deep); }

  .menu-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .legend-box {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 16px;
    background: rgba(255, 255, 255, 0.78);
    border: 2px dashed #c7ddff;
    border-radius: 18px;
    padding: 10px 14px;
    margin-bottom: 18px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 22px;
    height: 22px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
  }

  .legend-dot.idle { background: #ffffff; border: 2px solid #bcd6ff; color: var(--ink-soft); }
  .legend-dot.done { background: var(--mint-soft); border: 2px solid var(--mint); color: var(--mint-deep); }
  .legend-dot.gold { background: var(--gold); border: 2px solid var(--gold-deep); color: #5c3700; }
  .legend-dot.coral { background: var(--coral); border: 2px solid var(--coral-deep); color: #ffffff; }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 560px;
    margin: 0 auto;
  }

  @media (max-width: 480px) {
    .num-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .num-btn {
      border-radius: 16px;
      font-size: clamp(19px, 5.5vw, 24px);
    }
    .num-btn .num-badge {
      top: 4px;
      right: 5px;
      font-size: 12px;
    }
    .num-btn .num-sub {
      font-size: 10px;
    }
  }

  .num-btn {
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    background: #ffffff;
    border: 3px solid #c6deff;
    box-shadow: 0 6px 0 #b6d3fc;
    color: var(--ink);
    font-family: var(--font-en);
    font-weight: 700;
    font-size: clamp(22px, 5vw, 28px);
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
  }

  .num-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    border-color: var(--blue);
    background: #f5faff;
  }

  .num-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b6d3fc;
  }

  .num-btn .num-badge {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 14px;
    line-height: 1;
  }

  .num-btn .num-sub {
    font-family: var(--font-zh);
    font-size: 11px;
    font-weight: 700;
    opacity: 0.8;
  }

  .num-btn.done {
    background: var(--mint-soft);
    border-color: var(--mint);
    box-shadow: 0 6px 0 #68cfc4;
    color: #0e5952;
  }

  .num-btn.locked-simple {
    background: linear-gradient(180deg, #ffe066 0%, var(--gold) 100%);
    border-color: var(--gold-deep);
    box-shadow: 0 5px 0 #c98200;
    color: #543200;
    cursor: default;
  }

  .num-btn.locked-advanced {
    background: linear-gradient(180deg, #ff8787 0%, var(--coral) 100%);
    border-color: var(--coral-deep);
    box-shadow: 0 5px 0 #c43939;
    color: #ffffff;
    cursor: default;
  }

  /* =========================================================
     7. 闖關答題畫面（星星進度列、中文提示、答案格、立體字母鍵）
     ========================================================= */
  .progress-panel {
    background: rgba(255, 255, 255, 0.88);
    border: 2px solid #d5e6ff;
    border-radius: 22px;
    padding: 12px 14px;
    margin-bottom: 14px;
    box-shadow: 0 6px 14px rgba(58, 134, 255, 0.08);
  }

  .progress-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .stage-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--blue-soft);
    color: var(--blue-deep);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .mode-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 900;
  }
  .mode-chip.simple { background: var(--mint-soft); color: var(--mint-deep); }
  .mode-chip.advanced { background: var(--gold-soft); color: var(--gold-deep); }

  .star-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
  }

  .star-item {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .star-item svg {
    width: 24px;
    height: 24px;
    fill: #dde9fa;
    stroke: #b5cef2;
    stroke-width: 1.8;
    transition: fill 0.3s ease, stroke 0.3s ease, filter 0.3s ease;
  }

  .star-item.lit {
    transform: scale(1.18);
  }

  .star-item.lit svg {
    fill: var(--gold);
    stroke: var(--gold-deep);
    filter: drop-shadow(0 0 6px rgba(255, 183, 3, 0.75));
  }

  .star-item.current svg {
    fill: #ffffff;
    stroke: var(--blue);
    stroke-width: 2.2;
  }

  .progress-track {
    width: 100%;
    height: 10px;
    background: #e3efff;
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--mint) 0%, var(--gold) 100%);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .clue-box {
    text-align: center;
    background: linear-gradient(180deg, #f6fbff 0%, #edf6ff 100%);
    border: 2px solid #d2e6ff;
    border-radius: 22px;
    padding: 16px 14px 18px;
    margin-bottom: 20px;
  }

  .clue-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--blue-deep);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .clue-meaning {
    font-size: clamp(28px, 6.5vw, 38px);
    font-weight: 900;
    color: var(--ink);
    line-height: 1.25;
    margin: 0 0 12px;
  }

  .speak-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #ffffff;
    color: var(--blue-deep);
    border: 2px solid #9dc4ff;
    border-radius: 999px;
    padding: 7px 18px;
    font-family: var(--font-zh);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 #b8d5ff;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  .speak-btn:hover { background: var(--blue-soft); }
  .speak-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8d5ff; }
  .speak-btn.speaking {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold-deep);
    box-shadow: 0 4px 0 #e5a300, 0 0 0 5px rgba(255, 183, 3, 0.25);
    animation: speakPulse 0.9s ease-in-out infinite;
  }

  @keyframes speakPulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 4px 0 #e5a300, 0 0 0 4px rgba(255, 183, 3, 0.22);
    }
    50% {
      transform: scale(1.06);
      box-shadow: 0 4px 0 #e5a300, 0 0 0 10px rgba(255, 183, 3, 0.42);
    }
  }

  /* 拼字答案格 */
  .answer-slots {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 64px;
    margin-bottom: 22px;
  }

  .slot {
    width: 54px;
    height: 60px;
    border-radius: 16px;
    background: #fff9e6;
    border: 3px solid var(--gold);
    box-shadow: 0 4px 0 #e5a300;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-en);
    font-weight: 700;
    font-size: 28px;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.15s ease;
  }

  .slot:hover:not(.empty) {
    transform: translateY(-2px);
    background: #fff1bf;
  }

  .slot:active:not(.empty) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #e5a300;
  }

  .slot.empty {
    background: #f4f8ff;
    border: 3px dashed #aacbff;
    box-shadow: none;
    cursor: default;
  }

  .slot.correct-pop {
    background: var(--mint-soft);
    border-color: var(--mint);
    box-shadow: 0 4px 0 var(--mint-deep);
    color: #0e5952;
    animation: slotPop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slotPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }

  /* 英文字母按鍵區 */
  .letter-bank {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }

  .letter-bank.advanced-bank {
    gap: 8px;
  }

  .tile {
    width: 54px;
    height: 58px;
    border-radius: 16px;
    background: linear-gradient(180deg, #ffffff 0%, #eef5ff 100%);
    border: 3px solid #9ec4ff;
    box-shadow: 0 5px 0 #7fb0ff, 0 6px 12px rgba(58, 134, 255, 0.12);
    color: var(--blue-deep);
    font-family: var(--font-en);
    font-weight: 700;
    font-size: 26px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  .letter-bank.advanced-bank .tile {
    width: 46px;
    height: 50px;
    font-size: 22px;
    border-radius: 14px;
  }

  .tile:hover:not(:disabled) {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #ffffff 0%, #dcebff 100%);
    border-color: var(--blue);
  }

  .tile:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #7fb0ff;
  }

  .tile.used {
    visibility: hidden;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    .slot {
      width: 46px;
      height: 52px;
      font-size: 24px;
    }
    .tile {
      width: 48px;
      height: 52px;
      font-size: 24px;
    }
    .letter-bank.advanced-bank .tile {
      width: 40px;
      height: 44px;

<script>
/**
 * ============================================================
 * U10單字密室：破解逃脫 — 核心遊戲邏輯
 * ============================================================
 */

/* ---- 1. 單字庫（嚴格對應 U10 課程 10 個單字） ---- */
const WORDS = [
  {en:'right', zh:'右邊'},
  {en:'sight', zh:'視覺、視力'},
  {en:'phone', zh:'電話'},
  {en:'photo', zh:'相片'},
  {en:'she', zh:'她'},
  {en:'shop', zh:'商店'},
  {en:'ship', zh:'船艦'},
  {en:'dish', zh:'碟盤、菜餚'},
  {en:'fish', zh:'魚'},
  {en:'thin', zh:'瘦小的'}
];

const ALPHABET = 'abcdefghijklmnopqrstuvwxyz'.split('');
const TOTAL_NUMBERS = 16;
const STORAGE_KEY = 'u10_vocab_escape_records_v1';

/* ---- 2. 遊戲狀態管理 ---- */
let mode = 'simple';             // 'simple' | 'advanced'
let letterCase = 'lower';        // 'lower' (預設小寫，符合小三課本) | 'upper'
let soundEnabled = true;         // 音效開關
let currentScreen = 'mode';      // 'mode' | 'select' | 'puzzle' | 'finale'

const perfectSet = new Set();    // 零失誤完美過關的號碼索引 (0 ~ 15)
const perfectModeMap = new Map();// 號碼索引 -> 'simple' | 'advanced'
const doneSet = new Set();       // 已完成至少一次的號碼索引 (0 ~ 15)

let roundNumber = null;          // 目前挑戰中的號碼 (0 ~ 15)
let roundOrder = [];             // 本輪打亂後的題目索引陣列
let roundPos = 0;                // 本輪目前題目進度 (0 ~ 9)
let roundWrongCount = 0;         // 本輪累計答錯次數

let built = [];                  // 已放入答案格的物件陣列：{ ch, tileIdx }
let bankState = [];              // 字母盤陣列：{ ch, used }

let isTransitioning = false;     // 過場鎖定旗標，避免連點開門或計時器競爭條件
let nextTimerId = null;          // 切題計時器 ID
let speechTimerId = null;        // 進入新題目自動朗讀延遲計時器 ID
let speakAnimFallbackId = null;  // 朗讀按鈕動畫防卡住保底計時器 ID
let activeSpeakBtn = null;       // 目前正在播放脈動動畫的發音按鈕參考

/* ---- DOM 元素參考 ---- */
const stage = document.getElementById('stage');
const caseToggleBtn = document.getElementById('caseToggleBtn');
const caseBadge = document.getElementById('caseBadge');
const soundToggleBtn = document.getElementById('soundToggleBtn');
const soundIcon = document.getElementById('soundIcon');
const soundLabel = document.getElementById('soundLabel');
const resetModal = document.getElementById('resetModal');
const cancelResetBtn = document.getElementById('cancelResetBtn');
const confirmResetBtn = document.getElementById('confirmResetBtn');

/* ---- 3. 本地進度讀寫（localStorage） ---- */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.done)) {
      data.done.forEach(n => {
        if (Number.isInteger(n) && n >= 0 && n < TOTAL_NUMBERS) doneSet.add(n);
      });
    }
    if (Array.isArray(data.perfect)) {
      data.perfect.forEach(n => {
        if (Number.isInteger(n) && n >= 0 && n < TOTAL_NUMBERS) perfectSet.add(n);
      });
    }
    if (data.perfectMode && typeof data.perfectMode === 'object') {
      Object.entries(data.perfectMode).forEach(([k, v]) => {
        const idx = Number(k);
        if (Number.isInteger(idx) && (v === 'simple' || v === 'advanced')) {
          perfectModeMap.set(idx, v);
        }
      });
    }
    if (data.letterCase === 'lower' || data.letterCase === 'upper') {
      letterCase = data.letterCase;
    }
    if (typeof data.soundEnabled === 'boolean') {
      soundEnabled = data.soundEnabled;
    }
  } catch (err) {
    // 忽略無痕模式或儲存限制造成的錯誤
  }
}

function saveProgress() {
  try {
    const perfectModeObj = {};
    perfectModeMap.forEach((val, key) => {
      perfectModeObj[key] = val;
    });
    const payload = {
      done: Array.from(doneSet),
      perfect: Array.from(perfectSet),
      perfectMode: perfectModeObj,
      letterCase,
      soundEnabled
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (err) {
    // 若瀏覽器停用 localStorage，安全略過
  }
}

/* ---- 4. 清除過場計時器與待播語音（避免切頁後殘留語音或誤觸發） ---- */
function cancelSpeech() {
  if (speechTimerId !== null) {
    clearTimeout(speechTimerId);
    speechTimerId = null;
  }
  if (speakAnimFallbackId !== null) {
    clearTimeout(speakAnimFallbackId);
    speakAnimFallbackId = null;
  }
  if (activeSpeakBtn) {
    activeSpeakBtn.classList.remove('speaking');
    activeSpeakBtn = null;
  }
  if (speechSupported) {
    try {
      window.speechSynthesis.cancel();
    } catch (err) {
      // 安全略過瀏覽器語音取消限制
    }
  }
}

function clearPendingTransition() {
  if (nextTimerId !== null) {
    clearTimeout(nextTimerId);
    nextTimerId = null;
  }
  isTransitioning = false;
  cancelSpeech();
}

/* ---- 5. 合成音效引擎（Web Audio API，含 suspended 喚醒與 try/catch） ---- */
let actx = null;

function getAudioContext() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  if (!actx) {
    actx = new AudioCtx();
  }
  if (actx.state === 'suspended') {
    actx.resume().catch(() => {});
  }
  return actx;
}

function playTone(freq, startOffset, duration, type = 'sine', gainVal = 0.16) {
  if (!soundEnabled) return;
  try {
    const c = getAudioContext();
    if (!c) return;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(g);
    g.connect(c.destination);

    const t0 = c.currentTime + startOffset;
    g.gain.setValueAtTime(Math.max(0.0001, gainVal), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  } catch (err) {
    // 平板或 Safari 音訊受限時靜默降級
  }
}

function playTileClick() {
  playTone(580, 0, 0.07, 'triangle', 0.14);
}

function playUndoClick() {
  playTone(420, 0, 0.07, 'sine', 0.11);
}

function playGentleWarn() {
  playTone(392, 0, 0.11, 'sine', 0.12);
  playTone(330, 0.11, 0.13, 'sine', 0.12);
}

function playCorrect() {
  playTone(523.25, 0, 0.14, 'triangle', 0.18);
  playTone(659.25, 0.11, 0.14, 'triangle', 0.18);
  playTone(783.99, 0.22, 0.22, 'triangle', 0.2);
}

function playWrong() {
  playTone(250, 0, 0.15, 'sawtooth', 0.11);
  playTone(195, 0.11, 0.2, 'sawtooth', 0.11);
}

function playWin() {
  const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
  const times = [0, 0.11, 0.22, 0.34, 0.48, 0.6];
  const durs  = [0.14, 0.14, 0.14, 0.18, 0.12, 0.36];
  notes.forEach((f, idx) => playTone(f, times[idx], durs[idx], 'triangle', 0.2));
}

/* ---- 6. 英文語音發音引擎（Web Speech API） ---- */
const speechSupported = (
  typeof window !== 'undefined' &&
  'speechSynthesis' in window &&
  typeof SpeechSynthesisUtterance !== 'undefined'
);

function speakWord(word, triggerBtn = null) {
  if (!speechSupported || !word) return;
  try {
    // 先清除前一次佇列與動畫計時器，避免語音重疊或狀態殘留
    cancelSpeech();

    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US';
    utter.rate = 0.85;   // 稍慢的清晰語速，適合國小三年級聆聽拼讀
    utter.pitch = 1.05;

    const finishSpeakingAnim = () => {
      if (speakAnimFallbackId !== null) {
        clearTimeout(speakAnimFallbackId);
        speakAnimFallbackId = null;
      }
      if (triggerBtn) {
        triggerBtn.classList.remove('speaking');
      }
      if (activeSpeakBtn === triggerBtn) {
        activeSpeakBtn = null;
      }
    };

    if (triggerBtn) {
      activeSpeakBtn = triggerBtn;
      triggerBtn.classList.add('speaking');
      utter.onstart = () => {
        if (activeSpeakBtn === triggerBtn) {
          triggerBtn.classList.add('speaking');
        }
      };
      utter.onend = finishSpeakingAnim;
      utter.onerror = finishSpeakingAnim;
      // 保底計時：避免部分瀏覽器未觸發 onend 導致脈動動畫無法停止
      speakAnimFallbackId = setTimeout(finishSpeakingAnim, 2500);
    }

    window.speechSynthesis.speak(utter);
  } catch (err) {
    if (triggerBtn) triggerBtn.classList.remove('speaking');
  }
}

/* ---- 7. 工具函式 ---- */
function formatLetter(ch) {
  return letterCase === 'upper' ? ch.toUpperCase() : ch.toLowerCase();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function scrambledLetters(word) {
  const letters = word.toLowerCase().split('');
  let s = shuffle(letters);
  let tries = 0;
  while (s.join('') === word.toLowerCase() && tries < 10) {
    s = shuffle(letters);
    tries++;
  }

function renderStarProgress(completedCount, totalCount) {
  const pct = Math.round((completedCount / totalCount) * 100);
  let starsHtml = '';
  for (let i = 0; i < totalCount; i++) {
    let cls = 'star-item';
    if (i < completedCount) cls += ' lit';
    else if (i === completedCount) cls += ' current';
    starsHtml += `
      <div class="${cls}" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.4l2.85 5.9 6.5.85-4.75 4.55 1.18 6.45L12 17.05l-5.78 3.1 1.18-6.45L2.65 9.15l6.5-.85z"/>
        </svg>
      </div>
    `;
  }
  return `
    <div class="star-row">${starsHtml}</div>
    <div class="progress-track" role="progressbar" aria-valuenow="${completedCount}" aria-valuemin="0" aria-valuemax="${totalCount}">
      <div class="progress-fill" style="width: ${pct}%"></div>
    </div>
  `;
}

  `;

  }

  // 進入每道門作答前自動播放該題英語單字發音（依頂部音效開關決定）
  if (soundEnabled && speechSupported) {
    if (autoSpeakImmediate) {
      speakWord(currentWord.en, speakBtn);
    } else {
      // 後續題目短暫延遲 200ms，避免與前一道門的答對音效重疊
      speechTimerId = setTimeout(() => {
        speechTimerId = null;

      }, 200);

    clearPendingTransition();

  };

    if (built.length > 0) playUndoClick();
    built = [];
    bankState.forEach(t => { t.used = false; });
    renderSlots(currentWord.en.length);
    renderBank();
    setFeedback('', '');
  };

  document.getElementById('submitBtn').onclick = checkAnswer;
}

/* 繪製答案格（點擊可精準退回該字母牌） */
function renderSlots(len, celebrate = false) {
  const slotsEl = document.getElementById('slots');
  if (!slotsEl) return;

  let html = '';
  for (let i = 0; i < len; i++) {
    const item = built[i];
    if (item) {
      const extraCls = celebrate ? ' correct-pop' : '';
      html += `<button type="button" class="slot${extraCls}" data-i="${i}" aria-label="移除第 ${i + 1} 個字母 ${formatLetter(item.ch)}">${formatLetter(item.ch)}</button>`;
    } else {
      html += `<div class="slot empty" aria-hidden="true"></div>`;
    }
  }
  slotsEl.innerHTML = html;

  slotsEl.querySelectorAll('button.slot').forEach(el => {
    el.onclick = () => {
      if (isTransitioning) return;
      const pos = Number(el.dataset.i);
      const removed = built[pos];
      if (!removed) return;

      // 精準恢復原本那張字母牌（修正 photo 等重複字母退回錯誤）
      if (mode === 'simple' && bankState[removed.tileIdx]) {
        bankState[removed.tileIdx].used = false;
      }
      built.splice(pos, 1);
      playUndoClick();
      renderSlots(len);
      renderBank();
      setFeedback('', '');
    };
  });
}

/* 繪製字母按鈕區 */
function renderBank() {
  const bankEl = document.getElementById('bank');
  if (!bankEl) return;

  bankEl.innerHTML = bankState.map((tile, idx) => {
    const usedCls = tile.used ? ' used' : '';
    const disabledAttr = tile.used ? 'disabled aria-hidden="true" tabindex="-1"' : '';
    return `<button type="button" class="tile${usedCls}" data-i="${idx}" ${disabledAttr}>${formatLetter(tile.ch)}</button>`;
  }).join('');

  bankEl.querySelectorAll('.tile').forEach(el => {
    el.onclick = () => {
      if (isTransitioning) return;
      const idx = Number(el.dataset.i);
      pickTile(idx);
    };
  });
}

function pickTile(tileIdx) {
  const currentWord = WORDS[roundOrder[roundPos]];
  if (!currentWord) return;
  const wordLen = currentWord.en.length;

  if (built.length >= wordLen) return;
  const tile = bankState[tileIdx];
  if (!tile || tile.used) return;

  if (mode === 'simple') {
    tile.used = true;
  }
  built.push({ ch: tile.ch, tileIdx });
  playTileClick();
  renderSlots(wordLen);
  renderBank();
  setFeedback('', '');
}

function setFeedback(msg, cls) {
  const f = document.getElementById('feedback');
  if (!f) return;
  f.textContent = msg;
  f.className = 'feedback' + (cls ? ' ' + cls : '');
}

function triggerCardShake(className) {
  const card = document.getElementById('puzzleCard');
  if (!card) return;
  card.classList.remove('shake', 'gentle-shake');
  void card.offsetWidth;
  card.classList.add(className);
}

/* 檢查答案：含未填滿防呆、大小寫忽略比對與過場鎖定 */
function checkAnswer() {
  if (isTransitioning || currentScreen !== 'puzzle') return;

  const currentWord = WORDS[roundOrder[roundPos]];
  if (!currentWord) return;

  // 1. 若空格未填滿，溫柔提醒且絕不計入答錯次數
  if (built.length < currentWord.en.length) {
    playGentleWarn();
    setFeedback('還有空格沒填滿喔！全部填好再按開門吧～', 'warn');
    triggerCardShake('gentle-shake');
    return;
  }

  // 2. 不區分大小寫進行比對
  const answerStr = built.map(item => item.ch).join('').toLowerCase();
  if (answerStr === currentWord.en.toLowerCase()) {
    isTransitioning = true; // 立即鎖定防止連點重複加分或越界
    playCorrect();
    renderSlots(currentWord.en.length, true);
    setFeedback('太棒了！答對了，這道魔法門開了 ✨', 'right');

    roundPos++;
    nextTimerId = setTimeout(() => {
      nextTimerId = null;
      isTransitioning = false;
      if (roundPos >= WORDS.length) {
        finishRound();
      } else {
        renderPuzzle();
      }
    }, 850);
  } else {
    playWrong();
    roundWrongCount++;
    setFeedback('差一點點喔！再檢查一下字母順序，一定可以拼對！', 'wrong');
    triggerCardShake('shake');
  }
}

      : '太神啦！一次都沒出錯，這扇門已經點亮金色星星永久鎖定囉！你是最強密室小高手！🌟';

function spawnConfetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }
  const colors = ['#ffb703', '#2ec4b6', '#3a86ff', '#ff6b6b', '#a855f7', '#fb7185'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);

  for (let i = 0; i < 65; i++) {
    const el = document.createElement('div');
    el.className = 'confetto';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.1 + Math.random() * 1.9) + 's';
    el.style.animationDelay = (Math.random() * 0.65) + 's';
    el.style.borderRadius = Math.random() > 0.45 ? '50%' : '3px';
    layer.appendChild(el);
  }
  setTimeout(() => layer.remove(), 4800);
}

  updateToolbarUI();
  saveProgress();
  playTileClick();

  // 若正在答題畫面，即時更新答案格與字母盤大小寫，不影響已輸入進度
  if (currentScreen === 'puzzle') {
    const currentWord = WORDS[roundOrder[roundPos]];
    if (currentWord) {
      renderSlots(currentWord.en.length);
      renderBank();
    }
  }
};

soundToggleBtn.onclick = () => {
  soundEnabled = !soundEnabled;
  updateToolbarUI();
  saveProgress();
  if (soundEnabled) {
    playTileClick();
  } else {
    cancelSpeech();
  }
};

/* ============================================================
 * 14. 實體鍵盤操作支援（A-Z 輸入、Backspace 刪最後一字、Space 重聽、Enter 開門）
 * ============================================================ */
document.addEventListener('keydown', (e) => {
  // 若確認彈窗開啟中，僅處理 Escape 關閉彈窗
  if (!resetModal.classList.contains('hidden')) {
    if (e.key === 'Escape') closeResetModal();
    return;
  }

  // 僅在答題畫面且未處於過場鎖定時接受鍵盤拼字
  if (currentScreen !== 'puzzle' || isTransitioning) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const currentWord = WORDS[roundOrder[roundPos]];
  if (!currentWord) return;

  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (speechSupported) {
      speakWord(currentWord.en, document.getElementById('speakBtn'));
    }
    return;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    checkAnswer();
    return;
  }

  if (e.key === 'Backspace') {
    if (built.length > 0) {
      e.preventDefault();
      const removed = built.pop();
      if (mode === 'simple' && bankState[removed.tileIdx]) {
        bankState[removed.tileIdx].used = false;
      }
      playUndoClick();
      renderSlots(currentWord.en.length);
      renderBank();
      setFeedback('', '');
    }
    return;
  }

  if (/^[a-zA-Z]$/.test(e.key)) {
    const targetCh = e.key.toLowerCase();
    const matchIdx = bankState.findIndex(
      t => !t.used && t.ch.toLowerCase() === targetCh
    );
    if (matchIdx !== -1) {
      e.preventDefault();
      pickTile(matchIdx);
    }
  }
});

/* ============================================================
 * 15. 啟動應用程式
 * ============================================================ */
loadProgress();
updateToolbarUI();
renderModeSelect();
</script>
</body>
</html>
